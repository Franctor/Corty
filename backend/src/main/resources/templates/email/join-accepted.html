<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 0;">
    <tr><td align="center">
      <table width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);">
        <tr>
          <td style="background:#58CC02;padding:32px 40px;text-align:center;">
            <h1 style="margin:0;color:#ffffff;font-size:28px;font-weight:900;letter-spacing:-0.5px;">Corty</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:40px;">
            <h2 style="margin:0 0 16px;color:#1a1a1a;font-size:22px;font-weight:700;">¡Petición aceptada!</h2>
            <p style="margin:0 0 16px;color:#555;font-size:15px;line-height:1.6;">
              Hola <strong th:text="${username}"></strong>, tu solicitud para unirte al partido ha sido aceptada.
            </p>
            <table width="100%" cellpadding="0" cellspacing="0"
                   style="margin:16px 0;background:#f9f9f9;border-radius:10px;padding:20px;border:1px solid #eee;">
              <tr>
                <td style="padding:6px 0;color:#888;font-size:13px;width:120px;">Pista</td>
                <td style="padding:6px 0;color:#1a1a1a;font-size:14px;font-weight:600;" th:text="${courtName}"></td>
              </tr>
              <tr>
                <td style="padding:6px 0;color:#888;font-size:13px;">Club</td>
                <td style="padding:6px 0;color:#1a1a1a;font-size:14px;font-weight:600;" th:text="${clubName}"></td>
              </tr>
              <tr>
                <td style="padding:6px 0;color:#888;font-size:13px;">Fecha</td>
                <td style="padding:6px 0;color:#1a1a1a;font-size:14px;font-weight:600;" th:text="${date}"></td>
              </tr>
              <tr>
                <td style="padding:6px 0;color:#888;font-size:13px;">Hora</td>
                <td style="padding:6px 0;color:#1a1a1a;font-size:14px;font-weight:600;" th:text="${startTime}"></td>
              </tr>
            </table>
            <p style="margin:32px 0 0;color:#888;font-size:13px;line-height:1.6;">
              ¡Que disfrutes del partido!
            </p>
            <p style="margin:16px 0 0;color:#aaa;font-size:12px;text-align:center;">
              &copy; <span th:text="${year}"></span> Corty. Todos los derechos reservados.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
