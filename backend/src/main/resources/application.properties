#application.properties
# App config
spring.application.name=backend
spring.profiles.active=dev

# Media
corty.media.upload-dir=uploads
spring.config.import=optional:classpath:application-secrets.properties,optional:file:src/main/resources/application-secrets.properties

# Mail — Gmail SMTP (puerto 465 SSL para compatibilidad con Railway)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
