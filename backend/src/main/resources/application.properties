#application.properties
# App config
spring.application.name=backend
spring.profiles.active=dev

# Media
corty.media.upload-dir=uploads
spring.config.import=optional:classpath:application-secrets.properties,optional:file:src/main/resources/application-secrets.properties

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

corty.mail.from=corty.apps@gmail.com