#application.properties
# App config
spring.application.name=backend
spring.profiles.active=dev

# Media
corty.media.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.config.import=optional:classpath:application-secrets.properties,optional:file:src/main/resources/application-secrets.properties

corty.mail.from=${MAIL_FROM}
corty.mail.brevo-api-key=${BREVO_API_KEY}
