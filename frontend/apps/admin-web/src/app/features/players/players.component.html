<div class="players-page">

  <app-admin-page-header
    title="Jugadores"
    subtitle="Consulta y edita los perfiles de los jugadores registrados"
    buttonLabel="Añadir jugador"
    [showButton]="canEdit()"
    secondButtonLabel="Carga CSV"
    [showSecondButton]="canEdit()"
    (buttonClick)="openCreate()"
    (secondButtonClick)="openCsv()"
  />

  <app-admin-table
    [columns]="columns"
    [rows]="players()"
    [loading]="loading()"
    [canEdit]="canEditRow"
    [canDelete]="canDeleteRow"
    (editRow)="openEdit($event)"
    (deleteRow)="$event"
  />

</div>

<!-- Modal editar jugador -->
@if (editItem()) {
  <app-admin-modal title="Editar jugador" (closeModal)="editItem.set(null)">
    <form class="player-form" [formGroup]="editForm" (ngSubmit)="saveEdit()">

      <div class="player-form__row">
        <div class="player-form__field">
          <label class="player-form__label">Nombre</label>
          <input class="player-form__input" formControlName="name" />
        </div>
        <div class="player-form__field">
          <label class="player-form__label">Apellido</label>
          <input class="player-form__input" formControlName="surname" />
        </div>
      </div>

      <div class="player-form__row">
        <div class="player-form__field">
          <label class="player-form__label">Teléfono</label>
          <input class="player-form__input" formControlName="phone" />
        </div>
        <div class="player-form__field">
          <label class="player-form__label">Fecha de nacimiento</label>
          <input class="player-form__input" type="date" formControlName="birthDate" />
        </div>
      </div>

      <div class="player-form__row">
        <div class="player-form__field">
          <label class="player-form__label">Género</label>
          <ui-select placeholder="Selecciona género..." [options]="genderOptions" formControlName="gender" />
        </div>
        <div class="player-form__field">
          <label class="player-form__label">Karma (0–100)</label>
          <input class="player-form__input" type="number" formControlName="karma" min="0" max="100" />
        </div>
      </div>

      <div class="player-form__field">
        <label class="player-form__label">Biografía</label>
        <textarea class="player-form__input player-form__textarea" formControlName="biography" rows="3"></textarea>
      </div>

      <ui-location-select formControlName="cityId" />

      <div class="player-form__actions">
        <button type="button" class="player-form__btn player-form__btn--cancel" (click)="editItem.set(null)">Cancelar</button>
        <button type="submit" class="player-form__btn player-form__btn--save" [disabled]="editForm.invalid || saving()">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>

    </form>
  </app-admin-modal>
}

<!-- Modal crear jugador -->
@if (createOpen()) {
  <app-admin-modal title="Añadir jugador" (closeModal)="createOpen.set(false)">
    <form class="player-form" [formGroup]="createForm" (ngSubmit)="saveCreate()">

      <div class="player-form__row">
        <div class="player-form__field">
          <label class="player-form__label">Usuario</label>
          <input class="player-form__input" formControlName="username" autocomplete="off" />
        </div>
        <div class="player-form__field">
          <label class="player-form__label">Email</label>
          <input class="player-form__input" type="email" formControlName="email" />
        </div>
      </div>

      <div class="player-form__field">
        <label class="player-form__label">Contraseña</label>
        <input class="player-form__input" type="password" formControlName="password" autocomplete="new-password" />
      </div>

      <div class="player-form__row">
        <div class="player-form__field">
          <label class="player-form__label">Nombre</label>
          <input class="player-form__input" formControlName="name" />
        </div>
        <div class="player-form__field">
          <label class="player-form__label">Apellido</label>
          <input class="player-form__input" formControlName="surname" />
        </div>
      </div>

      <div class="player-form__row">
        <div class="player-form__field">
          <label class="player-form__label">Teléfono</label>
          <input class="player-form__input" formControlName="phone" />
        </div>
        <div class="player-form__field">
          <label class="player-form__label">Fecha de nacimiento</label>
          <input class="player-form__input" type="date" formControlName="birthDate" />
        </div>
      </div>

      <div class="player-form__row">
        <div class="player-form__field">
          <label class="player-form__label">Género</label>
          <ui-select placeholder="Selecciona género..." [options]="genderOptions" formControlName="gender" />
        </div>
        <div class="player-form__field">
          <label class="player-form__label">Karma inicial</label>
          <input class="player-form__input" type="number" formControlName="karma" min="0" max="100" />
        </div>
      </div>

      <div class="player-form__field">
        <label class="player-form__label">Biografía</label>
        <textarea class="player-form__input player-form__textarea" formControlName="biography" rows="3"></textarea>
      </div>

      <ui-location-select formControlName="cityId" />

      <label class="player-form__checkbox">
        <input type="checkbox" formControlName="verified" />
        <span>Activar cuenta directamente (sin email de verificación)</span>
      </label>

      <div class="player-form__actions">
        <button type="button" class="player-form__btn player-form__btn--cancel" (click)="createOpen.set(false)">Cancelar</button>
        <button type="submit" class="player-form__btn player-form__btn--save" [disabled]="createForm.invalid || saving()">
          {{ saving() ? 'Guardando...' : 'Crear jugador' }}
        </button>
      </div>

    </form>
  </app-admin-modal>
}

<!-- Modal carga masiva CSV -->
@if (csvOpen()) {
  <app-admin-modal title="Carga masiva CSV" (closeModal)="csvOpen.set(false)">
    <div class="csv-upload">

      <p class="csv-upload__hint">
        Sube un archivo <strong>.csv</strong> con las columnas:
        <code>email, username, password, name, surname, phone, gender, birthDate, verified</code>
      </p>

      <a class="csv-upload__template" href="/players-template.csv" download>
        <lucide-icon name="download" [size]="14" />
        Descargar plantilla
      </a>

      <label class="csv-upload__dropzone" [class.csv-upload__dropzone--selected]="csvFile">
        <input type="file" accept=".csv" (change)="onCsvSelected($event)" hidden />
        @if (csvFile) {
          <lucide-icon name="file-text" [size]="20" />
          <span>{{ csvFile.name }}</span>
        } @else {
          <lucide-icon name="upload" [size]="20" />
          <span>Haz clic para seleccionar archivo</span>
        }
      </label>

      <div class="player-form__actions">
        <button type="button" class="player-form__btn player-form__btn--cancel" (click)="csvOpen.set(false)">Cancelar</button>
        <button
          type="button"
          class="player-form__btn player-form__btn--save"
          [disabled]="!csvFile || csvUploading()"
          (click)="uploadCsv()"
        >
          {{ csvUploading() ? 'Subiendo...' : 'Importar' }}
        </button>
      </div>

    </div>
  </app-admin-modal>
}
