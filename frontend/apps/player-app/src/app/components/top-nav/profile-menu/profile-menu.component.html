<div class="profile-menu">

    <button class="profile-menu__item" (click)="goToProfile()">
        <span class="profile-menu__icon">
            <ion-icon name="person-outline" aria-hidden="true" />
        </span>
        <span class="profile-menu__label">Perfil</span>
    </button>

    <div class="profile-menu__divider"></div>

    <button class="profile-menu__item profile-menu__item--danger" (click)="logout()">
        <span class="profile-menu__icon">
            <ion-icon name="log-out-outline" aria-hidden="true" />
        </span>
        <span class="profile-menu__label">Cerrar sesión</span>
    </button>

</div>
