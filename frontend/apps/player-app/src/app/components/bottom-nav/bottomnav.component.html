<nav class="bottom-nav">
  @for (item of navItems; track item.tab) {
    <a class="bottom-nav__item" [routerLink]="item.href" routerLinkActive="bottom-nav__item--active" [routerLinkActiveOptions]="{exact: false}">
      <ion-icon [name]="item.icon" class="bottom-nav__icon" />
      <span class="bottom-nav__label">{{ item.label }}</span>
    </a>
  }
</nav>
