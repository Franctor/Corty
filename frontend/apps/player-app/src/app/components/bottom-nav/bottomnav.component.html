<ion-tabs>

    <ion-router-outlet />

    <ion-tab-bar slot="bottom">
        @for (item of navItems; track item.tab) {
        <ion-tab-button [tab]="item.tab" [href]="item.href" [attr.aria-label]="item.label">
            <ion-icon [name]="item.icon" aria-hidden="true" />
            <ion-label>{{ item.label }}</ion-label>
        </ion-tab-button>
        }
    </ion-tab-bar>

</ion-tabs>
