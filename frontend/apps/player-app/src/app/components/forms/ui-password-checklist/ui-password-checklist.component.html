@if (visible) {
  <div class="password-checklist">
    <span [class.valid]="!errors['minLength']"> Mínimo 8 caracteres</span>
    <span [class.valid]="!errors['noUppercase']"> Una mayúscula</span>
    <span [class.valid]="!errors['noNumber']"> Un número</span>
    <span [class.valid]="!errors['noSpecialChar']"> Un carácter especial</span>
  </div>
}
