<ui-form-field [label]="label" [optional]="optional" [control]="ngControl.control">
  <ion-input
    type="password"
    [placeholder]="placeholder"
    [disabled]="isDisabled()"
    [value]="value()"
    [class.form-input--error]="ngControl.control?.invalid && ngControl.control?.touched"
    class="form-input"
    (ionInput)="onInput($event)"
    (ionBlur)="onBlur()">
    <ion-input-password-toggle slot="end" />
  </ion-input>
</ui-form-field>
