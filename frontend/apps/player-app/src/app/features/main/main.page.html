<!-- ── DESKTOP (≥ 768px) ──────────────────────────────────── -->
@if (isDesktop()) {
<div class="desktop-layout">

  <!-- Top navigation bar -->
  <nav class="topnav" role="navigation" aria-label="Navegación principal">

    <!-- Logo -->
    <div class="topnav__logo">
      <lib-corty-logo mode="full" [size]="36" />
    </div>

    <!-- Nav links -->
    <div class="topnav__links">
      @for (item of navItems; track item.tab) {
      <a class="topnav__link" [routerLink]="['/main', item.tab]" routerLinkActive="topnav__link--active"
        [routerLinkActiveOptions]="{ exact: false }" [attr.aria-label]="item.label">
        <ion-icon [name]="item.icon" aria-hidden="true" />
        {{ item.label }}
      </a>
      }
    </div>

    <!-- Right actions: theme toggle (+ future: notifications, avatar) -->
    <div class="topnav__actions">
      <lib-theme-toggle />
    </div>

  </nav>

  <!-- Routed page content -->
  <main class="desktop-layout__content">
    <router-outlet />
  </main>

</div>
}

<!-- ── MOBILE (< 768px) ────────────────────────────────────── -->
@if (!isDesktop()) {
<ion-tabs>

  <ion-router-outlet />

  <ion-tab-bar slot="bottom">
    @for (item of navItems; track item.tab) {
    <ion-tab-button [tab]="item.tab" [attr.aria-label]="item.label">
      <ion-icon [name]="item.icon" aria-hidden="true" />
      <ion-label>{{ item.label }}</ion-label>
    </ion-tab-button>
    }
  </ion-tab-bar>

</ion-tabs>
}
