<ion-tabs>
  @if (isDesktop()) {
    <app-topnav slot="top" />
  }

  <ion-tab-bar slot="bottom" class="app-tab-bar">
    @for (item of navItems; track item.tab) {
      <ion-tab-button [tab]="item.tab" [routerLink]="item.href">
        <ion-icon [name]="item.icon" />
        <ion-label>{{ item.label }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
