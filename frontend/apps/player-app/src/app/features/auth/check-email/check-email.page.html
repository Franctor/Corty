<ion-content class="check-email-content">
  <div class="check-email-wrapper">

    <lib-corty-logo mode="icon" [size]="96" />

    <div class="check-email-card">
      <div class="check-email-card__icon">
        <lucide-icon [img]="mailIcon" [size]="48" />
      </div>
      <h1 class="check-email-card__title">Revisa tu correo</h1>
      <p class="check-email-card__text">
        Te hemos enviado un enlace de activación. Haz clic en él para activar tu cuenta y empezar a jugar.
      </p>
      <p class="check-email-card__hint">
        Si no lo ves, revisa la carpeta de spam.
      </p>
    </div>

    <ion-button routerLink="/auth/login" expand="block" fill="clear" class="check-email-back">
      Volver al inicio de sesión
    </ion-button>

  </div>
</ion-content>
