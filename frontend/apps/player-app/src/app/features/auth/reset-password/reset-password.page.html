<ion-content class="login-content">
  <div class="login-content__bg">
    <div class="login-wrapper">

      <div class="brand">
        <lib-corty-logo mode="icon" [size]="80" />
        <h1 class="brand__name">Nueva contraseña</h1>
      </div>

      @if (done()) {
        <div class="sent-card">
          <p class="sent-card__text">¡Contraseña actualizada correctamente! Ya puedes iniciar sesión con tu nueva contraseña.</p>
          <a routerLink="/auth/login" class="login-footer__link">Ir al inicio de sesión</a>
        </div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
          <ui-password label="Nueva contraseña" placeholder="Tu nueva contraseña" formControlName="newPassword" />
          <ui-password-checklist [control]="newPassword" />
          <ui-password label="Confirmar contraseña" placeholder="Repite la contraseña" formControlName="confirmPassword" />
          <ion-button type="submit" expand="block" class="login-btn" [disabled]="loading()">
            @if (loading()) { <ion-spinner name="crescent" /> } @else { Guardar contraseña }
          </ion-button>
        </form>
      }

    </div>
  </div>
</ion-content>
