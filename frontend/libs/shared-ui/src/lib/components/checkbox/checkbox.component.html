<button
  type="button"
  class="ui-checkbox"
  [class.ui-checkbox--checked]="checked()"
  [class.ui-checkbox--disabled]="disabled() || false"
  (click)="toggle()"
  role="checkbox"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="label()"
>
  <span class="ui-checkbox__box">
    @if (checked()) {
      <svg class="ui-checkbox__check" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M1 5L4.5 8.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
  </span>
  <span class="ui-checkbox__label">{{ label() }}</span>
</button>
