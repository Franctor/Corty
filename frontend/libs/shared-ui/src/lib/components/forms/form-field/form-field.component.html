<div class="form-group">

  <label class="form-label">
    {{ label }}
    @if (optional) {
      <span class="form-label__optional">(opcional)</span>
    }
  </label>

  <!-- Control projected from the parent (ui-input, ui-select, etc.) -->
  <ng-content />

  @if (showError) {
    <span class="form-error" role="alert">{{ error }}</span>
  }

</div>
