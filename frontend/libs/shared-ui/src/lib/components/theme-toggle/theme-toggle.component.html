<button
  class="theme-toggle"
  [class.theme-toggle--dark]="theme.isDark()"
  (click)="theme.toggle()"
  [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
  type="button"
>
  <span class="theme-toggle__track">
    <span class="theme-toggle__thumb">
      @if (!theme.isDark()) {
        <lucide-icon name="sun" [size]="14" />
      }
      @if (theme.isDark()) {
        <lucide-icon name="moon" [size]="14" />
      }
    </span>
  </span>
</button>
