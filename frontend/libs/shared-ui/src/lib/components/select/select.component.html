<div class="ui-select" [class.ui-select--open]="isOpen()" [class.ui-select--disabled]="isDisabled()">

  <div class="ui-select__control" [class.ui-select__control--open]="isOpen()">
    <input
      class="ui-select__input"
      [placeholder]="placeholder()"
      [value]="inputValue()"
      [disabled]="isDisabled()"
      (input)="onInput($any($event.target).value)"
      (focus)="open()"
      autocomplete="off"
    />
    <span class="ui-select__icon">
      @if (isOpen()) {
        <lucide-icon name="chevron-up" [size]="12" />
      } @else {
        <lucide-icon name="chevron-down" [size]="12" />
      }
    </span>
  </div>

  @if (isOpen()) {
    <div class="ui-select__dropdown">
      @if (filtered().length === 0) {
        <p class="ui-select__empty">Sin resultados</p>
      }
      @for (option of filtered(); track option.value) {
        <div
          class="ui-select__option"
          [class.ui-select__option--active]="selectedOption()?.value === option.value"
          (mousedown)="select(option)"
        >
          {{ option.label }}
        </div>
      }
    </div>
  }

</div>
